<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okno - A Window in Time</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F5F3ED; /* Warm eggshell */
      color: #4A5A52; /* Muted eucalyptus text */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      font-weight: 200;
      letter-spacing: 0.2em;
    }

    .tagline {
      font-size: 1.3rem;
      font-weight: 300;
      font-style: italic;
      color: #7A9487; /* Soft eucalyptus */
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .hero-copy {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #5A6B62; /* Darker eucalyptus */
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .trust-signals {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0;
      font-size: 0.85rem;
      color: rgba(90, 107, 98, 0.6);
      flex-wrap: wrap;
    }

    .trust-signals span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status {
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(143, 181, 165, 0.08);
      border-radius: 8px;
      font-size: 1.1rem;
      color: #5A6B62;
    }

    .status.authenticated {
      background: rgba(143, 181, 165, 0.15);
      border: 1px solid rgba(143, 181, 165, 0.35);
      color: #4A5A52;
    }

    .status.error {
      background: rgba(184, 134, 123, 0.15);
      border: 1px solid rgba(184, 134, 123, 0.35);
      color: #8B6F66;
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      margin: 0.5rem;
      transition: all 0.2s ease;
      font-weight: 500;
      box-shadow: 0 4px 14px 0 rgba(255, 255, 255, 0.1);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(255, 255, 255, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      padding: 1.5rem 3rem;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: #8FB5A5; /* Soft eucalyptus */
      color: #F5F3ED; /* Warm eggshell text */
      border-radius: 16px;
      box-shadow: 0 8px 24px 0 rgba(143, 181, 165, 0.25);
      margin: 1.5rem 0.5rem;
    }

    button.primary:hover {
      transform: translateY(-3px);
      background: #7DA594; /* Slightly darker eucalyptus */
      box-shadow: 0 12px 32px 0 rgba(143, 181, 165, 0.35);
    }

    button.secondary {
      background: rgba(143, 181, 165, 0.1);
      color: #5A6B62;
      border: 1px solid rgba(143, 181, 165, 0.25);
      font-size: 0.95rem;
    }

    button.secondary:hover {
      background: rgba(143, 181, 165, 0.18);
      border-color: rgba(143, 181, 165, 0.35);
    }

    .picker-status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(143, 181, 165, 0.08);
      border-radius: 8px;
      display: none;
      color: #5A6B62;
    }

    .picker-status.visible {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(143, 181, 165, 0.25);
      border-top-color: #8FB5A5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .links {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(143, 181, 165, 0.2);
    }

    .links a {
      color: rgba(90, 107, 98, 0.6);
      text-decoration: none;
      margin: 0 1rem;
      font-size: 0.9rem;
    }

    .links a:hover {
      color: #5A6B62;
    }

    .photo-count {
      font-size: 2rem;
      font-weight: bold;
      color: #8FB5A5;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OKNO</h1>
    <p class="tagline">A Window in Time</p>

    <div id="heroContent">
      <p class="hero-copy">
        Your memories, always visible.
      </p>
    </div>

    <div id="status" class="status">
      <div class="loading"></div> Checking authentication...
    </div>

    <div id="actions"></div>

    <div id="pickerStatus" class="picker-status"></div>

    <div class="links">
      <a href="mailto:sam@samshennan.com?subject=Okno Bug Report">Report a Bug</a>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const actionsEl = document.getElementById('actions');
    const pickerStatusEl = document.getElementById('pickerStatus');

    let pickerWindow = null;
    let pollInterval = null;

    // Check authentication status on load
    async function checkAuth() {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();

        if (data.authenticated) {
          // Hide hero copy when authenticated
          document.getElementById('heroContent').style.display = 'none';

          // Check if photos are cached
          const healthRes = await fetch('/api/health');
          const health = await healthRes.json();

          if (health.cache && health.cache.totalItems > 0) {
            statusEl.className = 'status authenticated';
            statusEl.textContent = `${health.cache.totalItems} photos ready`;
            actionsEl.innerHTML = `
              <button class="primary" onclick="window.location.href='/slideshow.html'">Start Slideshow</button>
              <br>
              <button class="secondary" onclick="openPicker()">Change Photos</button>
              <br><br>
              <button class="secondary" onclick="signOut()" style="background: rgba(231, 76, 60, 0.15); border-color: rgba(231, 76, 60, 0.3); color: rgba(231, 76, 60, 1);">Sign Out</button>
            `;
          } else {
            statusEl.style.display = 'none';
            actionsEl.innerHTML = `
              <button class="primary" onclick="openPicker()">Select Photos</button>
              <br><br>
              <button class="secondary" onclick="signOut()" style="background: rgba(231, 76, 60, 0.15); border-color: rgba(231, 76, 60, 0.3); color: rgba(231, 76, 60, 1);">Sign Out</button>
            `;
          }
        } else {
          statusEl.style.display = 'none';
          actionsEl.innerHTML = `
            <a href="/auth/login" style="text-decoration: none;">
              <button style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; font-size: 1rem;">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                  <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Sign in with Google
              </button>
            </a>
          `;
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = '✗ Error checking authentication';
        console.error('Auth check failed:', error);
      }
    }

    async function openPicker() {
      try {
        // Show loading state
        pickerStatusEl.className = 'picker-status visible';
        pickerStatusEl.innerHTML = '<div class="loading"></div> Creating picker session...';

        // Create picker session
        const res = await fetch('/api/picker/start', { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to create picker session');
        }

        // Detect if mobile/iPad (tabs) or desktop (popups)
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
          // iPad opens picker in new tab - show instructions
          pickerStatusEl.innerHTML = `
            <p>✓ Picker session created</p>
            <p style="font-size: 0.9rem; opacity: 0.7; margin: 1rem 0;">
              1. Tap the button below to open Google Photos<br>
              2. Select your photos and tap "Done"<br>
              3. Come back to this tab and tap "Check for Photos"
            </p>
            <button onclick="window.open('${data.pickerUrl}', '_blank')">Open Picker</button>
            <button onclick="checkPickerComplete('${data.sessionId}')" style="margin-top: 0.5rem;">Check for Photos</button>
          `;
        } else {
          // Desktop - open popup and auto-detect close
          pickerStatusEl.innerHTML = `
            <p>Opening Google Photos Picker...</p>
            <p style="font-size: 0.9rem; opacity: 0.7;">Select your photos, then close the picker window</p>
          `;

          const width = 800;
          const height = 800;
          const left = (screen.width - width) / 2;
          const top = (screen.height - height) / 2;

          pickerWindow = window.open(
            data.pickerUrl,
            'GooglePhotosPicker',
            `width=${width},height=${height},left=${left},top=${top}`
          );

          // Start polling for completion
          startPolling(data.sessionId, parseInt(data.pollInterval) || 5000);
        }

      } catch (error) {
        pickerStatusEl.className = 'picker-status visible';
        pickerStatusEl.innerHTML = `
          <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
        `;
        console.error('Picker error:', error);
      }
    }

    function startPolling(sessionId, interval) {
      pollInterval = setInterval(async () => {
        try {
          // Check if picker window was closed
          if (pickerWindow && pickerWindow.closed) {
            pickerStatusEl.innerHTML = '<div class="loading"></div> Fetching selected photos...';

            // Wait 2 seconds for Google to finalize the selection
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Window closed, check status
            const statusRes = await fetch(`/api/picker/status/${sessionId}`);
            const status = await statusRes.json();

            if (status.done) {
              // Photos were selected, fetch them
              clearInterval(pollInterval);

              const completeRes = await fetch(`/api/picker/complete/${sessionId}`, {
                method: 'POST'
              });
              const result = await completeRes.json();

              if (!completeRes.ok) {
                throw new Error(result.error || 'Failed to fetch photos');
              }

              pickerStatusEl.innerHTML = `
                <div style="color: #2ecc71;">✓ Success! ${result.count} photos cached</div>
              `;

              // Refresh UI after 2 seconds
              setTimeout(() => {
                pickerStatusEl.className = 'picker-status';
                checkAuth();
              }, 2000);
            } else {
              // Window closed without selecting photos
              clearInterval(pollInterval);
              pickerStatusEl.innerHTML = `
                <div style="opacity: 0.7;">Picker closed without selecting photos</div>
              `;
              setTimeout(() => {
                pickerStatusEl.className = 'picker-status';
              }, 3000);
            }
          }
        } catch (error) {
          clearInterval(pollInterval);
          pickerStatusEl.innerHTML = `
            <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
          `;
          console.error('Polling error:', error);
        }
      }, interval);
    }

    // Manual check for picker completion (for iPad/mobile)
    async function checkPickerComplete(sessionId) {
      try {
        pickerStatusEl.innerHTML = '<div class="loading"></div> Checking for photos...';

        // Wait a moment for Google to finalize
        await new Promise(resolve => setTimeout(resolve, 1000));

        // Check picker status
        const statusRes = await fetch(`/api/picker/status/${sessionId}`);
        const status = await statusRes.json();

        if (status.done) {
          // Photos were selected, fetch them
          pickerStatusEl.innerHTML = '<div class="loading"></div> Fetching selected photos...';

          const completeRes = await fetch(`/api/picker/complete/${sessionId}`, {
            method: 'POST'
          });
          const result = await completeRes.json();

          if (!completeRes.ok) {
            throw new Error(result.error || 'Failed to fetch photos');
          }

          pickerStatusEl.innerHTML = `
            <div style="color: #2ecc71;">✓ Success! ${result.count} photos cached</div>
          `;

          // Refresh UI after 2 seconds
          setTimeout(() => {
            pickerStatusEl.className = 'picker-status';
            checkAuth();
          }, 2000);
        } else {
          pickerStatusEl.innerHTML = `
            <div style="opacity: 0.7;">No photos selected yet. Select photos and try again.</div>
          `;
          setTimeout(() => {
            pickerStatusEl.className = 'picker-status';
          }, 3000);
        }
      } catch (error) {
        pickerStatusEl.innerHTML = `
          <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
        `;
        console.error('Check complete error:', error);
      }
    }

    // Sign out
    async function signOut() {
      if (!confirm('Are you sure you want to sign out? This will clear your session and require re-authentication.')) {
        return;
      }

      try {
        const res = await fetch('/auth/logout', { method: 'POST' });
        if (res.ok) {
          window.location.reload();
        } else {
          alert('Sign out failed. Please try again.');
        }
      } catch (error) {
        console.error('Sign out error:', error);
        alert('Sign out failed: ' + error.message);
      }
    }

    // Initialize
    checkAuth();
  </script>
</body>
</html>
