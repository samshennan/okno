<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Okno Demo</title>

  <!-- PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okno">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <!-- NoSleep.js required for iOS PWAs - Wake Lock API broken until iOS 18.4 (WebKit bug #254545) -->
  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <link rel="stylesheet" href="/css/demo.css">
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading demo photos...</p>
  </div>

  <div id="error">
    <h2>Error</h2>
    <p id="errorMessage"></p>
    <button data-action="home">Back to Home</button>
  </div>

  <div id="slideshow"></div>

  <!-- DEMO badge + exit link (top-right, always visible) -->
  <div class="demo-topbar">
    <div class="demo-pill demo-badge">DEMO</div>
    <a href="/login" class="demo-pill demo-try-link">Try it →</a>
  </div>

  <!-- Photo date overlay (bottom-left, always visible when enabled) -->
  <div id="photoDateOverlay" class="slideshow-overlay"></div>

  <!-- Clock overlay (bottom-right, always visible when enabled) -->
  <div id="clockOverlay" class="slideshow-overlay"></div>

  <!-- Progress Bar -->
  <div id="progressBarContainer">
    <div id="progressBar"></div>
  </div>

  <!-- End-of-demo CTA overlay -->
  <div id="endOfDemoCTA">
    <div class="cta-title">That's a taste of Okno</div>
    <div class="cta-subtitle">Your own photos would look even better.</div>
    <div class="cta-buttons">
      <button class="cta-btn cta-btn-primary" data-action="home">Use your own photos</button>
      <button class="cta-btn cta-btn-secondary" data-action="restart-demo">Watch again</button>
    </div>
  </div>
  <script src="/js/demo.js"></script>
</body>

</html>
