<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okno - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <div class="container">
    <div class="window-icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="20" width="80" height="65" rx="4" stroke="#7A9487" stroke-width="4" fill="none" />
        <line x1="50" y1="20" x2="50" y2="85" stroke="#7A9487" stroke-width="3" />
        <line x1="10" y1="52" x2="90" y2="52" stroke="#7A9487" stroke-width="3" />
        <circle cx="30" cy="36" r="4" fill="#8FB5A5" opacity="0.6" />
        <circle cx="70" cy="68" r="4" fill="#8FB5A5" opacity="0.6" />
      </svg>
    </div>

    <h1>Okno</h1>
    <p class="tagline">A Window in Time</p>

    <div class="card">
      <div id="error-box" class="error-message"></div>

      <p>Sign in with your Google account to start your personal photo frame.</p>

      <a href="/auth/login" class="sign-in-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </a>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>

</html>
