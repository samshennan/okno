<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okno - A Window in Time</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      font-weight: 200;
      letter-spacing: 0.2em;
    }

    .tagline {
      font-size: 1.3rem;
      font-weight: 300;
      font-style: italic;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .hero-copy {
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .trust-signals {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      flex-wrap: wrap;
    }

    .trust-signals span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status {
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .status.authenticated {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }

    .status.error {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin: 0.5rem;
      transition: transform 0.1s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .picker-status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      display: none;
    }

    .picker-status.visible {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .links {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      margin: 0 1rem;
      font-size: 0.9rem;
    }

    .links a:hover {
      color: #fff;
    }

    .photo-count {
      font-size: 2rem;
      font-weight: bold;
      color: #2ecc71;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OKNO</h1>
    <p class="tagline">A Window in Time</p>

    <div id="heroContent">
      <p class="hero-copy">
        Every photo is a portal to a moment that shaped you.
        Okno keeps those windows open—always rotating, always reminding you
        of the life you've lived.
      </p>

      <div class="trust-signals">
        <span>🔒 Secure OAuth</span>
        <span>✅ Open Source</span>
        <span>🚫 No Data Collection</span>
      </div>
    </div>

    <div id="status" class="status">
      <div class="loading"></div> Checking authentication...
    </div>

    <div id="actions"></div>

    <div id="pickerStatus" class="picker-status"></div>

    <div class="links">
      <a href="https://github.com/samshennan/okno" target="_blank">View on GitHub</a>
      <a href="/api/health">Health Check</a>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const actionsEl = document.getElementById('actions');
    const pickerStatusEl = document.getElementById('pickerStatus');

    let pickerWindow = null;
    let pollInterval = null;

    // Check authentication status on load
    async function checkAuth() {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();

        if (data.authenticated) {
          // Hide hero copy when authenticated
          document.getElementById('heroContent').style.display = 'none';

          statusEl.className = 'status authenticated';
          statusEl.textContent = '✓ Authenticated with Google Photos';

          // Check if photos are cached
          const healthRes = await fetch('/api/health');
          const health = await healthRes.json();

          if (health.cache && health.cache.totalItems > 0) {
            actionsEl.innerHTML = `
              <div class="photo-count">${health.cache.totalItems} photos cached</div>
              <button onclick="openPicker()">Select Different Photos</button>
              <button onclick="window.location.href='/slideshow.html'">Start Slideshow</button>
              <br><br>
              <button onclick="signOut()" style="background: rgba(231, 76, 60, 0.8); color: #fff;">Sign Out</button>
            `;
          } else {
            actionsEl.innerHTML = `
              <button onclick="openPicker()">Select Photos</button>
              <br><br>
              <button onclick="signOut()" style="background: rgba(231, 76, 60, 0.8); color: #fff;">Sign Out</button>
            `;
          }
        } else {
          statusEl.className = 'status';
          statusEl.textContent = 'Ready to open your window?';
          actionsEl.innerHTML = `
            <button onclick="window.location.href='/auth/login'">Open Your Window</button>
          `;
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = '✗ Error checking authentication';
        console.error('Auth check failed:', error);
      }
    }

    async function openPicker() {
      try {
        // Show loading state
        pickerStatusEl.className = 'picker-status visible';
        pickerStatusEl.innerHTML = '<div class="loading"></div> Creating picker session...';

        // Create picker session
        const res = await fetch('/api/picker/start', { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to create picker session');
        }

        // Detect if mobile/iPad (tabs) or desktop (popups)
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
          // iPad opens picker in new tab - show instructions
          pickerStatusEl.innerHTML = `
            <p>✓ Picker session created</p>
            <p style="font-size: 0.9rem; opacity: 0.7; margin: 1rem 0;">
              1. Tap the button below to open Google Photos<br>
              2. Select your photos and tap "Done"<br>
              3. Come back to this tab and tap "Check for Photos"
            </p>
            <button onclick="window.open('${data.pickerUrl}', '_blank')">Open Picker</button>
            <button onclick="checkPickerComplete('${data.sessionId}')" style="margin-top: 0.5rem;">Check for Photos</button>
          `;
        } else {
          // Desktop - open popup and auto-detect close
          pickerStatusEl.innerHTML = `
            <p>Opening Google Photos Picker...</p>
            <p style="font-size: 0.9rem; opacity: 0.7;">Select your photos, then close the picker window</p>
          `;

          const width = 800;
          const height = 800;
          const left = (screen.width - width) / 2;
          const top = (screen.height - height) / 2;

          pickerWindow = window.open(
            data.pickerUrl,
            'GooglePhotosPicker',
            `width=${width},height=${height},left=${left},top=${top}`
          );

          // Start polling for completion
          startPolling(data.sessionId, parseInt(data.pollInterval) || 5000);
        }

      } catch (error) {
        pickerStatusEl.className = 'picker-status visible';
        pickerStatusEl.innerHTML = `
          <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
        `;
        console.error('Picker error:', error);
      }
    }

    function startPolling(sessionId, interval) {
      pollInterval = setInterval(async () => {
        try {
          // Check if picker window was closed
          if (pickerWindow && pickerWindow.closed) {
            pickerStatusEl.innerHTML = '<div class="loading"></div> Fetching selected photos...';

            // Wait 2 seconds for Google to finalize the selection
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Window closed, check status
            const statusRes = await fetch(`/api/picker/status/${sessionId}`);
            const status = await statusRes.json();

            if (status.done) {
              // Photos were selected, fetch them
              clearInterval(pollInterval);

              const completeRes = await fetch(`/api/picker/complete/${sessionId}`, {
                method: 'POST'
              });
              const result = await completeRes.json();

              if (!completeRes.ok) {
                throw new Error(result.error || 'Failed to fetch photos');
              }

              pickerStatusEl.innerHTML = `
                <div style="color: #2ecc71;">✓ Success! ${result.count} photos cached</div>
              `;

              // Refresh UI after 2 seconds
              setTimeout(() => {
                pickerStatusEl.className = 'picker-status';
                checkAuth();
              }, 2000);
            } else {
              // Window closed without selecting photos
              clearInterval(pollInterval);
              pickerStatusEl.innerHTML = `
                <div style="opacity: 0.7;">Picker closed without selecting photos</div>
              `;
              setTimeout(() => {
                pickerStatusEl.className = 'picker-status';
              }, 3000);
            }
          }
        } catch (error) {
          clearInterval(pollInterval);
          pickerStatusEl.innerHTML = `
            <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
          `;
          console.error('Polling error:', error);
        }
      }, interval);
    }

    // Manual check for picker completion (for iPad/mobile)
    async function checkPickerComplete(sessionId) {
      try {
        pickerStatusEl.innerHTML = '<div class="loading"></div> Checking for photos...';

        // Wait a moment for Google to finalize
        await new Promise(resolve => setTimeout(resolve, 1000));

        // Check picker status
        const statusRes = await fetch(`/api/picker/status/${sessionId}`);
        const status = await statusRes.json();

        if (status.done) {
          // Photos were selected, fetch them
          pickerStatusEl.innerHTML = '<div class="loading"></div> Fetching selected photos...';

          const completeRes = await fetch(`/api/picker/complete/${sessionId}`, {
            method: 'POST'
          });
          const result = await completeRes.json();

          if (!completeRes.ok) {
            throw new Error(result.error || 'Failed to fetch photos');
          }

          pickerStatusEl.innerHTML = `
            <div style="color: #2ecc71;">✓ Success! ${result.count} photos cached</div>
          `;

          // Refresh UI after 2 seconds
          setTimeout(() => {
            pickerStatusEl.className = 'picker-status';
            checkAuth();
          }, 2000);
        } else {
          pickerStatusEl.innerHTML = `
            <div style="opacity: 0.7;">No photos selected yet. Select photos and try again.</div>
          `;
          setTimeout(() => {
            pickerStatusEl.className = 'picker-status';
          }, 3000);
        }
      } catch (error) {
        pickerStatusEl.innerHTML = `
          <div style="color: #e74c3c;">✗ Error: ${error.message}</div>
        `;
        console.error('Check complete error:', error);
      }
    }

    // Sign out
    async function signOut() {
      if (!confirm('Are you sure you want to sign out? This will clear your session and require re-authentication.')) {
        return;
      }

      try {
        const res = await fetch('/auth/logout', { method: 'POST' });
        if (res.ok) {
          window.location.reload();
        } else {
          alert('Sign out failed. Please try again.');
        }
      } catch (error) {
        console.error('Sign out error:', error);
        alert('Sign out failed: ' + error.message);
      }
    }

    // Initialize
    checkAuth();
  </script>
</body>
</html>
