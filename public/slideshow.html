<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Okno Slideshow</title>

  <!-- PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okno">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.564.0/dist/umd/lucide.min.js"></script>

  <!-- NoSleep.js required for iOS PWAs - Wake Lock API broken until iOS 18.4 (WebKit bug #254545) -->
  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <link rel="stylesheet" href="/css/slideshow.css">
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading photos...</p>
  </div>

  <div id="error">
    <h2>Error</h2>
    <p id="errorMessage"></p>
    <button data-action="exit">Back to Home</button>
  </div>

  <div id="slideshow"></div>

  <!-- On This Day indicator (top-left, always visible when active) -->
  <div id="onThisDayIndicator">
    <span class="otd-icon"><i data-lucide="calendar-heart" class="icon-otd"></i></span>
    <span id="onThisDayDate"></span>
  </div>

  <!-- On This Day fallback message -->
  <div id="onThisDayMessage">
    <h3 id="onThisDayMsgText">No photos from today in history</h3>
    <p>Switching to all photos...</p>
  </div>

  <!-- Photo date overlay (bottom-left, always visible when enabled) -->
  <div id="photoDateOverlay" class="slideshow-overlay"></div>

  <!-- Clock overlay (bottom-right, always visible when enabled) -->
  <div id="clockOverlay" class="slideshow-overlay"></div>

  <!-- Progress Bar -->
  <div id="progressBarContainer">
    <div id="progressBar"></div>
  </div>

  <div id="sleepReminder">
    Screen wake enabled - photo frame will run indefinitely
  </div>

  <div id="intervalControls">
    <button class="small" data-interval="10">10s</button>
    <button class="small" data-interval="30">30s</button>
    <button class="small" data-interval="60">1m</button>
    <button class="small" data-interval="120">2m</button>
    <button class="small" data-interval="300">5m</button>
  </div>

  <div id="displayModeControls">
    <button class="small" data-mode="contain" title="Full photo, black bars">Show
      All</button>
    <button class="small" data-mode="cover" title="Zoom to fill, may crop edges">Fill
      Screen</button>
    <button class="small" data-mode="dual" title="2 portraits together">2
      Portraits</button>
  </div>

  <div id="info">
    Photo <span id="currentIndex">1</span> of <span id="totalPhotos">?</span>
  </div>

  <div id="keyboardHelp">
    <kbd>Space</kbd> / <kbd>P</kbd> Play/Pause &nbsp;
    <kbd>S</kbd> / <kbd>→</kbd> Next &nbsp;
    <kbd>←</kbd> Prev &nbsp;
    <kbd>Esc</kbd> Exit
  </div>

  <!-- Reconnect overlay (shown on 401 / session expired) -->
  <div id="reconnect-overlay">
    <div class="reconnect-card">
      <div class="reconnect-icon">
        <i data-lucide="lock" class="icon-reconnect"></i>
      </div>
      <h2>Session Expired</h2>
      <p>Your Google connection needs to be refreshed.</p>
      <button id="reconnect-btn" class="reconnect-button">
        <i data-lucide="refresh-cw" class="icon-button"></i>
        Reconnect
      </button>
    </div>
  </div>

  <!-- Hide photo button (appears with controls) -->
  <button id="hideBtn" class="hide-button" disabled>
    <i data-lucide="eye-off" class="icon-hide"></i> Hide
  </button>

  <!-- Hide photo toast with undo -->
  <div id="hideToast" class="hide-toast">
    <span>Photo hidden</span>
    <button id="undoHideBtn">Undo</button>
  </div>

  <div id="controls">
    <button data-action="previous"><i data-lucide="chevron-left"></i> Previous</button>
    <button data-action="play-pause" id="playPauseBtn"><i data-lucide="pause"></i> Pause</button>
    <button data-action="next">Next <i data-lucide="chevron-right"></i></button>
    <button class="secondary-action" data-action="fullscreen" id="fullscreenBtn"><i data-lucide="maximize"></i>
      Fullscreen</button>
    <button class="secondary-action" data-action="exit"><i data-lucide="log-out"></i> Exit</button>
  </div>
  <script src="/js/slideshow.js"></script>
</body>

</html>
