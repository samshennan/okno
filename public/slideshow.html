<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okno Slideshow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #slideshow {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Default: fill screen, crop if needed */
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .photo.contain-mode {
      object-fit: contain; /* Show full photo with black bars */
    }

    .photo.active {
      opacity: 1;
      z-index: 1;
    }

    .photo.preload {
      z-index: 0;
    }

    /* Dual portrait mode: 2 photos side-by-side */
    .photo.dual-left {
      width: 50%;
      left: 0;
    }

    .photo.dual-right {
      width: 50%;
      left: 50%;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 500px;
      padding: 2rem;
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      border-radius: 8px;
      display: none;
      z-index: 10;
    }

    #error.visible {
      display: block;
    }

    /* Neumorphic Control Panel */
    #controls {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      gap: 8px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      background: #F0F0F3;
      backdrop-filter: blur(20px);
      padding: 10px;
      border-radius: 16px;
      box-shadow: -6px -6px 16px rgba(255, 255, 255, 0.6),
                  6px 6px 16px rgba(0, 0, 0, 0.15);
    }

    #controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Neumorphic Buttons */
    button {
      background: #F0F0F3;
      color: #4A5A52;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.938rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px -4px 10px rgba(255, 255, 255, 0.8),
                  4px 4px 10px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: -6px -6px 14px rgba(255, 255, 255, 0.9),
                  6px 6px 14px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: translateY(0);
      box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.15),
                  inset 3px 3px 6px rgba(255, 255, 255, 0.7);
    }

    button.small {
      padding: 10px 16px;
      font-size: 0.813rem;
    }

    /* Active Button State - Sunken with Color */
    button.active {
      background: #8FB5A5;
      color: #FFFFFF;
      box-shadow: inset -3px -3px 6px rgba(125, 165, 148, 0.4),
                  inset 3px 3px 6px rgba(255, 255, 255, 0.2),
                  -2px -2px 6px rgba(255, 255, 255, 0.3),
                  2px 2px 6px rgba(143, 181, 165, 0.4);
    }

    button.active:hover {
      background: #7DA594;
      transform: translateY(-1px);
    }

    /* Neumorphic Interval Controls */
    #intervalControls {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      background: #F0F0F3;
      backdrop-filter: blur(20px);
      padding: 10px;
      border-radius: 16px;
      box-shadow: -6px -6px 16px rgba(255, 255, 255, 0.6),
                  6px 6px 16px rgba(0, 0, 0, 0.15);
    }

    #intervalControls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Neumorphic Display Mode Controls */
    #displayModeControls {
      position: fixed;
      top: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      background: #F0F0F3;
      backdrop-filter: blur(20px);
      padding: 10px;
      border-radius: 16px;
      box-shadow: -6px -6px 16px rgba(255, 255, 255, 0.6),
                  6px 6px 16px rgba(0, 0, 0, 0.15);
    }

    #displayModeControls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Neumorphic Info Panel */
    #info {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      font-size: 0.813rem;
      font-weight: 500;
      color: #4A5A52;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      background: #F0F0F3;
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: -4px -4px 10px rgba(255, 255, 255, 0.7),
                  4px 4px 10px rgba(0, 0, 0, 0.15);
    }

    #info.visible {
      opacity: 1;
    }

    #keyboardHelp {
      position: fixed;
      top: 2rem;
      left: 2rem;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      pointer-events: none;
      line-height: 1.6;
    }

    #keyboardHelp.visible {
      opacity: 1;
    }

    #keyboardHelp kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9em;
    }

    /* Hide keyboard help on mobile/iPad */
    @media (max-width: 768px), (pointer: coarse) {
      #keyboardHelp {
        display: none !important;
      }
    }

    /* Sleep reminder - mobile only */
    #sleepReminder {
      display: none;
      position: fixed;
      bottom: 6rem;
      left: 1rem;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 99;
      background: rgba(0, 0, 0, 0.85);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      pointer-events: none;
      text-align: left;
      max-width: calc(100% - 2rem);
      line-height: 1.3;
    }

    #sleepReminder.visible {
      opacity: 1;
    }

    /* Show sleep reminder only on mobile/iPad */
    @media (max-width: 768px), (pointer: coarse) {
      #sleepReminder {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading photos...</p>
  </div>

  <div id="error">
    <h2>Error</h2>
    <p id="errorMessage"></p>
    <button onclick="window.location.href='/'">Back to Home</button>
  </div>

  <div id="slideshow"></div>

  <div id="sleepReminder">
    💡 To keep screen on: Settings → Display & Brightness → Auto-Lock → Never
  </div>

  <div id="intervalControls">
    <button class="small" onclick="changeInterval(10)" data-interval="10">10s</button>
    <button class="small" onclick="changeInterval(30)" data-interval="30">30s</button>
    <button class="small" onclick="changeInterval(60)" data-interval="60">1m</button>
    <button class="small" onclick="changeInterval(120)" data-interval="120">2m</button>
    <button class="small" onclick="changeInterval(300)" data-interval="300">5m</button>
  </div>

  <div id="displayModeControls">
    <button class="small" onclick="setDisplayMode('contain')" data-mode="contain" title="Full photo, black bars">Show All</button>
    <button class="small" onclick="setDisplayMode('cover')" data-mode="cover" title="Zoom to fill, may crop edges">Fill Screen</button>
    <button class="small" onclick="setDisplayMode('dual')" data-mode="dual" title="2 portraits together">2 Portraits</button>
  </div>

  <div id="info">
    Photo <span id="currentIndex">1</span> of <span id="totalPhotos">?</span>
  </div>

  <div id="keyboardHelp">
    <kbd>Space</kbd> Play/Pause &nbsp;
    <kbd>←</kbd><kbd>→</kbd> Prev/Next &nbsp;
    <kbd>Esc</kbd> Exit
  </div>

  <div id="controls">
    <button onclick="previousPhoto()">← Previous</button>
    <button onclick="togglePlayPause()" id="playPauseBtn">Pause</button>
    <button onclick="nextPhoto()">Next →</button>
    <button onclick="toggleFullscreen()" id="fullscreenBtn">Fullscreen</button>
    <button onclick="window.location.href='/'">Exit</button>
  </div>

  <script>
    const slideshowEl = document.getElementById('slideshow');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const errorMessageEl = document.getElementById('errorMessage');
    const currentIndexEl = document.getElementById('currentIndex');
    const totalPhotosEl = document.getElementById('totalPhotos');
    const playPauseBtn = document.getElementById('playPauseBtn');

    let currentIndex = 0;
    let photoCount = 0;
    let isPlaying = true;
    let intervalHandle = null;
    let currentIntervalSeconds = 10; // Default 10 seconds
    let displayMode = 'cover'; // 'cover', 'contain', or 'dual'
    let pendingPortrait = null; // For dual mode: holds first portrait photo

    // Get params from URL
    const urlParams = new URLSearchParams(window.location.search);
    const customInterval = parseInt(urlParams.get('interval'));
    if (customInterval && customInterval > 0) {
      currentIntervalSeconds = customInterval;
    }
    const urlMode = urlParams.get('mode');
    if (urlMode && ['cover', 'contain', 'dual'].includes(urlMode)) {
      displayMode = urlMode;
    }

    async function init() {
      try {
        // Get photo count from health endpoint
        const healthRes = await fetch('/api/health');
        const health = await healthRes.json();

        if (!health.cache || health.cache.totalItems === 0) {
          // No photos available - redirect to home page
          window.location.href = '/';
          return;
        }

        photoCount = health.cache.totalItems;
        totalPhotosEl.textContent = photoCount;

        // Hide loading
        loadingEl.classList.add('hidden');

        // Update button states
        updateIntervalButtons();
        updateDisplayModeButtons();

        // Load first photo
        await loadPhoto(0);

        // Start slideshow
        startSlideshow();

      } catch (error) {
        console.error('Initialization failed:', error);
        showError(error.message);
      }
    }

    async function loadPhoto(index) {
      try {
        // Load new random photo
        const img = await createPhotoElement();

        // Check if portrait (taller than wide)
        const isPortrait = img.naturalHeight > img.naturalWidth;

        // Handle dual portrait mode
        if (displayMode === 'dual' && isPortrait) {
          if (!pendingPortrait) {
            // First portrait - save it and load another
            pendingPortrait = img;
            await loadPhoto(index); // Recursive call to get second photo
            return;
          } else {
            // Second portrait - show both side-by-side
            await showDualPortraits(pendingPortrait, img);
            pendingPortrait = null;
            return;
          }
        } else {
          // Not dual mode, or not portrait, or landscape in dual mode
          pendingPortrait = null; // Clear pending if we had one
          await showSinglePhoto(img);
        }

      } catch (error) {
        console.error('Failed to load photo:', error);
      }
    }

    async function createPhotoElement() {
      const img = document.createElement('img');
      img.className = 'photo preload';
      img.src = `/api/photo/random?t=${Date.now()}`;

      // Apply display mode class
      if (displayMode === 'contain') {
        img.classList.add('contain-mode');
      }

      // Wait for load
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      return img;
    }

    async function showSinglePhoto(img) {
      // Remove old photos
      const oldPhotos = slideshowEl.querySelectorAll('.photo');
      oldPhotos.forEach(photo => {
        if (!photo.classList.contains('active')) photo.remove();
      });

      slideshowEl.appendChild(img);

      // Trigger transition
      setTimeout(() => {
        const allPhotos = slideshowEl.querySelectorAll('.photo');
        allPhotos.forEach(photo => photo.classList.remove('active'));

        img.classList.add('active');
        img.classList.remove('preload');

        currentIndex = (currentIndex + 1) % photoCount;
        currentIndexEl.textContent = currentIndex + 1;

        setTimeout(() => {
          const oldPhotos = slideshowEl.querySelectorAll('.photo:not(.active)');
          oldPhotos.forEach(photo => photo.remove());
        }, 1000);
      }, 50);
    }

    async function showDualPortraits(img1, img2) {
      // Remove old photos
      const oldPhotos = slideshowEl.querySelectorAll('.photo');
      oldPhotos.forEach(photo => {
        if (!photo.classList.contains('active')) photo.remove();
      });

      // Position photos side-by-side
      img1.classList.add('dual-left');
      img2.classList.add('dual-right');

      slideshowEl.appendChild(img1);
      slideshowEl.appendChild(img2);

      // Trigger transition
      setTimeout(() => {
        const allPhotos = slideshowEl.querySelectorAll('.photo');
        allPhotos.forEach(photo => photo.classList.remove('active'));

        img1.classList.add('active');
        img2.classList.add('active');
        img1.classList.remove('preload');
        img2.classList.remove('preload');

        currentIndex = (currentIndex + 2) % photoCount;
        currentIndexEl.textContent = currentIndex + 1;

        setTimeout(() => {
          const oldPhotos = slideshowEl.querySelectorAll('.photo:not(.active)');
          oldPhotos.forEach(photo => photo.remove());
        }, 1000);
      }, 50);
    }

    function startSlideshow() {
      if (intervalHandle) {
        clearInterval(intervalHandle);
      }
      const intervalMs = currentIntervalSeconds * 1000;
      intervalHandle = setInterval(() => {
        if (isPlaying) {
          loadPhoto(currentIndex);
        }
      }, intervalMs);
      isPlaying = true;
      playPauseBtn.textContent = 'Pause';
    }

    function stopSlideshow() {
      if (intervalHandle) {
        clearInterval(intervalHandle);
        intervalHandle = null;
      }
      isPlaying = false;
      playPauseBtn.textContent = 'Play';
    }

    function togglePlayPause() {
      if (isPlaying) {
        stopSlideshow();
      } else {
        startSlideshow();
      }
    }

    function nextPhoto() {
      loadPhoto(currentIndex);
    }

    function previousPhoto() {
      // Just load a new random photo (we don't track history)
      loadPhoto(currentIndex);
    }

    function showError(message) {
      loadingEl.classList.add('hidden');
      errorMessageEl.textContent = message;
      errorEl.classList.add('visible');
    }

    // Change slideshow interval
    function changeInterval(seconds) {
      currentIntervalSeconds = seconds;
      updateIntervalButtons();
      if (isPlaying) {
        startSlideshow(); // Restart with new interval
      }
    }

    // Update active state of interval buttons
    function updateIntervalButtons() {
      const buttons = document.querySelectorAll('#intervalControls button');
      buttons.forEach(btn => {
        const btnInterval = parseInt(btn.dataset.interval);
        if (btnInterval === currentIntervalSeconds) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Set display mode
    function setDisplayMode(mode) {
      displayMode = mode;
      pendingPortrait = null; // Clear pending portrait when changing modes
      updateDisplayModeButtons();

      // Reload current photo with new mode
      loadPhoto(currentIndex);
    }

    // Update active state of display mode buttons
    function updateDisplayModeButtons() {
      const buttons = document.querySelectorAll('#displayModeControls button');
      buttons.forEach(btn => {
        const btnMode = btn.dataset.mode;
        if (btnMode === displayMode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Toggle fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error('Fullscreen request failed:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Control visibility
    let controlsVisible = false;
    let hideControlsTimeout = null;

    function showControls() {
      controlsVisible = true;
      document.getElementById('controls').classList.add('visible');
      document.getElementById('intervalControls').classList.add('visible');
      document.getElementById('displayModeControls').classList.add('visible');
      document.getElementById('info').classList.add('visible');
      document.getElementById('keyboardHelp').classList.add('visible');
      document.getElementById('sleepReminder').classList.add('visible');

      // Auto-hide after 4 seconds
      clearTimeout(hideControlsTimeout);
      hideControlsTimeout = setTimeout(hideControls, 4000);
    }

    function hideControls() {
      controlsVisible = false;
      document.getElementById('controls').classList.remove('visible');
      document.getElementById('intervalControls').classList.remove('visible');
      document.getElementById('displayModeControls').classList.remove('visible');
      document.getElementById('info').classList.remove('visible');
      document.getElementById('keyboardHelp').classList.remove('visible');
      document.getElementById('sleepReminder').classList.remove('visible');
    }

    function toggleControls() {
      if (controlsVisible) {
        hideControls();
      } else {
        showControls();
      }
    }

    // Click/tap anywhere to toggle controls
    document.body.addEventListener('click', (e) => {
      // If clicking a button when controls are visible, just reset timer
      if (e.target.tagName === 'BUTTON' && controlsVisible) {
        clearTimeout(hideControlsTimeout);
        hideControlsTimeout = setTimeout(hideControls, 4000);
        return;
      }

      // Otherwise toggle controls (including if button clicked while hidden)
      toggleControls();
    });

    // Show controls on any mouse movement (desktop)
    let mouseMoveTimeout;
    document.addEventListener('mousemove', () => {
      showControls();
      clearTimeout(mouseMoveTimeout);
      mouseMoveTimeout = setTimeout(() => {
        // Don't auto-hide on desktop, just when they stop moving
      }, 100);
    });

    // Initialize on load
    init();

    // Show controls briefly on load so user knows they exist
    setTimeout(() => {
      showControls();
    }, 500);

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === 'ArrowRight') {
        nextPhoto();
      } else if (e.key === 'ArrowLeft') {
        previousPhoto();
      } else if (e.key === 'Escape') {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
