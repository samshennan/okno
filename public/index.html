<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okno - A Window in Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.564.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/index.css">
</head>

<body>
  <div class="container">
    <div class="window-icon">
      <img id="oknoLogo" src="/logo.svg" alt="Okno Logo">
    </div>
    <h1>OKNO</h1>
    <p class="tagline">A Window in Time</p>

    <div id="heroContent">
      <p class="hero-copy">
        Your memories, always visible.<br>
        A quiet presence on your shelf.
      </p>
    </div>

    <div id="status" class="status">
      <div class="loading"></div> Checking authentication...
    </div>

    <div id="actions"></div>

    <div id="pickerStatus" class="picker-status"></div>

    <div class="links">
      <a href="/settings.html"><i data-lucide="settings"
          class="inline-icon-sm"></i>Settings</a>
      <a href="#" id="openFeedbackLink"><i data-lucide="bug"
          class="inline-icon-sm"></i>Report a Bug</a>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedbackModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Share Your Feedback</h2>
        <p class="modal-subtitle" id="modalSubtitle">Help us improve Okno</p>
      </div>

      <div class="modal-body" id="modalBody">
        <!-- Type Selector -->
        <div class="type-selector">
          <div class="type-option" data-feedback-type="bug" role="button" tabindex="0">
            <div class="type-icon"><i data-lucide="bug"></i></div>
            <div class="type-label">Bug Report</div>
          </div>
          <div class="type-option" data-feedback-type="feature" role="button" tabindex="0">
            <div class="type-icon"><i data-lucide="sparkles"></i></div>
            <div class="type-label">Feature Request</div>
          </div>
          <div class="type-option" data-feedback-type="donation" role="button" tabindex="0">
            <div class="type-icon"><i data-lucide="heart"></i></div>
            <div class="type-label">Support Us</div>
          </div>
        </div>
      </div>

      <div class="modal-actions is-hidden" id="modalActions">
        <button class="modal-btn modal-btn-secondary" data-modal-action="close">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="submitBtn" data-modal-action="submit">Submit</button>
      </div>
    </div>
  </div>
  <script src="/js/index.js"></script>
</body>

</html>
